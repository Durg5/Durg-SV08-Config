########################################################################
# Single-filament shims for MMU commands emitted by the slicer
#
# INCLUDED ONLY BY printer_MMX_DISABLED.cfg. Never include this in the
# enabled variant -- every macro here would override Happy Hare's real
# command of the same name.
#
# Your slicer profile wraps START_PRINT with MMU calls:
#
#     MMU_START_SETUP INITIAL_TOOL=3 REFERENCED_TOOLS=1,3 ...
#     MMU_START_CHECK
#     START_PRINT EXTRUDER=230 BED=65
#     MMU_START_LOAD_INITIAL_TOOL
#     ...
#     MMU_CHANGE_TOOL TOOL=3 NEXT_POS="178.061,281.468"
#
# With Happy Hare unloaded those are unknown commands and the print dies at
# the first one. These shims absorb them so a file sliced from the MMX
# profile still prints -- PROVIDED it only ever uses one tool.
#
# Design note: MMU_CHANGE_TOOL deliberately does NOT blanket no-op. It
# accepts the first tool it sees (single filament = whatever is loaded),
# ignores repeats, and HARD ERRORS on a genuine change to a different tool.
# Silently printing a multi-colour model in one colour would waste hours of
# filament; failing loudly costs you nothing.
########################################################################

# Tracks the first tool the file asks for, so we can tell "restating the
# initial tool" apart from "actually trying to swap filament".
[gcode_macro _MMX_SF_TOOL_STATE]
variable_active: -1
gcode:
    # storage only


[gcode_macro MMU_START_SETUP]
description: Single-filament shim - absorbs the slicer's MMU print setup
gcode:
    SET_GCODE_VARIABLE MACRO=_MMX_SF_TOOL_STATE VARIABLE=active VALUE=-1
    RESPOND PREFIX="MMX" MSG="Single-filament mode: MMU_START_SETUP ignored"


[gcode_macro MMU_START_CHECK]
description: Single-filament shim - no gates to check
gcode:
    RESPOND PREFIX="MMX" MSG="Single-filament mode: MMU_START_CHECK ignored"


[gcode_macro MMU_START_LOAD_INITIAL_TOOL]
description: Single-filament shim - filament is already loaded
gcode:
    RESPOND PREFIX="MMX" MSG="Single-filament mode: MMU_START_LOAD_INITIAL_TOOL ignored"


[gcode_macro MMU_END]
description: Single-filament shim - absorbs a direct MMU_END from the slicer
gcode:
    RESPOND PREFIX="MMX" MSG="Single-filament mode: MMU_END ignored"


[gcode_macro MMU_CHANGE_TOOL]
description: Single-filament shim - accepts one tool, refuses real tool changes
gcode:
    {% set t = params.TOOL|default(0)|int %}
    {% set cur = printer['gcode_macro _MMX_SF_TOOL_STATE'].active|int %}
    {% if cur < 0 %}
        SET_GCODE_VARIABLE MACRO=_MMX_SF_TOOL_STATE VARIABLE=active VALUE={t}
        RESPOND PREFIX="MMX" MSG="Single-filament mode: printing T{t} with the loaded filament"
    {% elif t == cur %}
        RESPOND PREFIX="MMX" MSG="Single-filament mode: repeat T{t}, ignored"
    {% else %}
        { action_raise_error("MMX is DISABLED but this file needs a real tool change (T%d -> T%d). Re-slice with a single-filament profile, or run MMX_ON and power up the MMX." % (cur, t)) }
    {% endif %}
