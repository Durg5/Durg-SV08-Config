# ======================= TOOLHEAD REPAIR MODE =======================
# Mainboard-only config. Loaded INSTEAD of printer.cfg by REPAIR_MODE_ON.
# No toolhead board, no Eddy, no MMX, no steppers/heaters, so the gantry
# moves freely by hand and nothing can heat up.
# Chamber light + screen LEDs only. Leave with REPAIR_MODE_OFF.
# ====================================================================

[include mainsail.cfg]
[include shell_command.cfg]
[include repair_mode.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_36FFDE05334D413222501451-if00
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[board_pins]
aliases:
    EXP1_6=PC10

# Chamber light bar. Toggle it in Mainsail's "Miscellaneous" panel.
[output_pin main_led]
pin: PA3
pwm: 1
value: 1
shutdown_value: 1
cycle_time: 0.010

[neopixel Screen_Colour]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 1
initial_GREEN: 0
initial_BLUE: 1

[delayed_gcode _REPAIR_MODE_BANNER]
initial_duration: 2
gcode:
    RESPOND PREFIX="REPAIR" MSG="REPAIR MODE active - toolhead not loaded. Run REPAIR_MODE_OFF when it's reconnected."
