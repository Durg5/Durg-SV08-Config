########################################################################
# MMX config hot-swap
#
# Klipper only ever loads printer.cfg, so switching between the MMX build
# and the single-filament build means copying one of two full variants
# over it:
#
#   printer_MMX_ENABLED.cfg   - Happy Hare, [mcu mmu], MMX sensors
#   printer_MMX_DISABLED.cfg  - single filament, NO [mcu mmu]
#
# The [mcu mmu] section is why this has to be a full-file swap rather than a
# conditional: if the MMX is powered off and that section is present, Klipper
# refuses to start at all.
#
#   MMX_ON    -> switch to MMX build and restart (MMX must be powered ON)
#   MMX_OFF   -> switch to single filament and restart (MMX may then be powered off)
#   MMX_MODE  -> report which build is currently live
#
# This file is included by BOTH variants, so you can always swap back.
#
# RECOVERY: if Klipper won't start (e.g. MMX_ON while the MMX is unplugged),
# the macros are unavailable. Fix it over SSH:
#
#   cp ~/printer_data/config/printer_MMX_DISABLED.cfg ~/printer_data/config/printer.cfg
#   sudo systemctl restart klipper
########################################################################

[gcode_shell_command mmx_swap_enabled]
command: bash /home/biqu/printer_data/config/mmx_swap.sh ENABLED
timeout: 15.
verbose: True

[gcode_shell_command mmx_swap_disabled]
command: bash /home/biqu/printer_data/config/mmx_swap.sh DISABLED
timeout: 15.
verbose: True


# Restart is deferred rather than called inline: RUN_SHELL_COMMAND returns
# before the copy has necessarily flushed, and restarting Klipper out from
# under a half-written printer.cfg is how you end up with an unbootable
# machine. Three seconds is ample for two file copies.
[delayed_gcode _MMX_DEFERRED_RESTART]
gcode:
    FIRMWARE_RESTART


[gcode_macro MMX_ON]
description: Switch to the MMX (Happy Hare) config and restart Klipper
gcode:
    RESPOND PREFIX="MMX" MSG="Switching to MMX ENABLED..."
    RESPOND PREFIX="MMX" MSG="The MMX MUST be powered on, or Klipper will fail to start."
    RUN_SHELL_COMMAND CMD=mmx_swap_enabled
    UPDATE_DELAYED_GCODE ID=_MMX_DEFERRED_RESTART DURATION=3


[gcode_macro MMX_OFF]
description: Switch to the single-filament config and restart Klipper
gcode:
    RESPOND PREFIX="MMX" MSG="Switching to MMX DISABLED (single filament)..."
    RESPOND PREFIX="MMX" MSG="Once Klipper is back up it is safe to power off the MMX."
    RUN_SHELL_COMMAND CMD=mmx_swap_disabled
    UPDATE_DELAYED_GCODE ID=_MMX_DEFERRED_RESTART DURATION=3


[gcode_macro MMX_MODE]
description: Report which config build is currently active
gcode:
    {% if printer.mmu is defined %}
        RESPOND PREFIX="MMX" MSG="MMX ENABLED - Happy Hare loaded, 4 gates"
    {% else %}
        RESPOND PREFIX="MMX" MSG="MMX DISABLED - single filament, no MMU"
    {% endif %}
