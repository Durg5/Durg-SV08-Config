########################################################################
# Toolhead REPAIR MODE
#
# Runs Klipper on the mainboard only (no toolhead board, Eddy or MMX) so the
# chamber light stays on while the toolhead is unplugged.
#
#   REPAIR_MODE_ON   -> restart into printer_REPAIR.cfg (light on, motors free)
#   REPAIR_MODE_OFF  -> restart into the normal printer.cfg
#
# Safe sequence (never unplug the toolhead with the printer powered):
#   1. REPAIR_MODE_ON
#   2. Power OFF, unplug the toolhead cable
#   3. Power ON  -> boots straight into repair mode, light on
#   ...work...
#   4. Power OFF, reconnect the toolhead, power ON
#   5. REPAIR_MODE_OFF
#
# Included by printer.cfg (both MMX variants) AND printer_REPAIR.cfg.
#
# RECOVERY over SSH (biqu@192.168.86.41):
#   bash ~/printer_data/config/repair_mode.sh OFF     (or ON)
########################################################################

[gcode_shell_command repair_mode_on]
command: bash /home/biqu/printer_data/config/repair_mode.sh ON
timeout: 15.
verbose: True

[gcode_shell_command repair_mode_off]
command: bash /home/biqu/printer_data/config/repair_mode.sh OFF
timeout: 15.
verbose: True

[gcode_macro REPAIR_MODE_ON]
description: Restart Klipper on the mainboard only, so the toolhead can be unplugged with the light still on
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("REPAIR_MODE_ON refused - a print is active")}
    {% endif %}
    RESPOND PREFIX="REPAIR" MSG="Switching to REPAIR MODE. Power off before unplugging the toolhead."
    RUN_SHELL_COMMAND CMD=repair_mode_on

[gcode_macro REPAIR_MODE_OFF]
description: Restart Klipper on the normal printer.cfg. Toolhead MUST be connected.
gcode:
    RESPOND PREFIX="REPAIR" MSG="Leaving REPAIR MODE. Toolhead board must be connected or Klipper will error."
    RUN_SHELL_COMMAND CMD=repair_mode_off
