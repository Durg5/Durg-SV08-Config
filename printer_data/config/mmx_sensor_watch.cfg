########################################################################
# MMX per-gate microswitch monitor  --  DIAGNOSTIC ONLY
#
# These are the four microswitches inside the MMX unit, wired to the MMU
# MCU (EBB42) on PB7 / PB5 / PB6 / PB8 via the MMU_PRE_GATE_0..3 aliases
# in mmu/base/mmu.cfg.
#
# They are deliberately declared as [gcode_button] and NOT as Happy Hare
# 'pre_gate_switch_pin_X' sensors. Consequences of that choice:
#
#   * Happy Hare never sees them, so MMX load/unload/select behaviour is
#     completely unchanged.
#   * They can never pause a print. There is no runout path at all.
#   * Both edges are reported in the console, whether or not a print is
#     running. (A [filament_switch_sensor] would NOT do this: Klipper only
#     fires insert_gcode when idle and runout_gcode when printing, so half
#     the transitions would be invisible.)
#
# Polarity is unverified. If a gate reports FILAMENT when it is actually
# empty, add '!' to that pin, e.g.  pin: ^!mmu:MMU_PRE_GATE_0
# For pure event-watching it does not matter -- both edges print either way.
#
# To silence without deleting: comment out the [include] line in printer.cfg
########################################################################

[gcode_button mmx_gate_0]
pin: ^mmu:MMU_PRE_GATE_0
press_gcode:
    RESPOND PREFIX="MMX" MSG="gate 0 switch -> FILAMENT"
release_gcode:
    RESPOND PREFIX="MMX" MSG="gate 0 switch -> EMPTY"

[gcode_button mmx_gate_1]
pin: ^mmu:MMU_PRE_GATE_1
press_gcode:
    RESPOND PREFIX="MMX" MSG="gate 1 switch -> FILAMENT"
release_gcode:
    RESPOND PREFIX="MMX" MSG="gate 1 switch -> EMPTY"

[gcode_button mmx_gate_2]
pin: ^mmu:MMU_PRE_GATE_2
press_gcode:
    RESPOND PREFIX="MMX" MSG="gate 2 switch -> FILAMENT"
release_gcode:
    RESPOND PREFIX="MMX" MSG="gate 2 switch -> EMPTY"

[gcode_button mmx_gate_3]
pin: ^mmu:MMU_PRE_GATE_3
press_gcode:
    RESPOND PREFIX="MMX" MSG="gate 3 switch -> FILAMENT"
release_gcode:
    RESPOND PREFIX="MMX" MSG="gate 3 switch -> EMPTY"


# Manual snapshot of every filament switch in the system, including the two
# Happy Hare owns (toolhead 4-to-1 adapter + extruder entry). Those two are
# claimed by HH's [filament_switch_sensor] objects and cannot also be bound
# to a [gcode_button], so they are polled on demand here instead.
#
# Usage:  MMX_SENSORS
[gcode_macro MMX_SENSORS]
description: Report state of all MMX / MMU filament switches
gcode:
    RESPOND PREFIX="MMX" MSG="---- sensor snapshot ----"
    RESPOND PREFIX="MMX" MSG="gate 0 (MMX)   : {'FILAMENT' if printer['gcode_button mmx_gate_0'].state == 'PRESSED' else 'EMPTY'}"
    RESPOND PREFIX="MMX" MSG="gate 1 (MMX)   : {'FILAMENT' if printer['gcode_button mmx_gate_1'].state == 'PRESSED' else 'EMPTY'}"
    RESPOND PREFIX="MMX" MSG="gate 2 (MMX)   : {'FILAMENT' if printer['gcode_button mmx_gate_2'].state == 'PRESSED' else 'EMPTY'}"
    RESPOND PREFIX="MMX" MSG="gate 3 (MMX)   : {'FILAMENT' if printer['gcode_button mmx_gate_3'].state == 'PRESSED' else 'EMPTY'}"
    RESPOND PREFIX="MMX" MSG="adapter (mmu_gate) : {'FILAMENT' if printer['filament_switch_sensor mmu_gate_sensor'].filament_detected else 'EMPTY'}"
    RESPOND PREFIX="MMX" MSG="extruder entry     : {'FILAMENT' if printer['filament_switch_sensor extruder_sensor'].filament_detected else 'EMPTY'}"
